<!doctype html>
<!-- 권취 길이와 속도로 도핑 시각을 계산하는 아이폰 홈 화면용 웹앱 (도핑시계·일반 계산기) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도핑시계</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도핑시계">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    color-scheme: light;
    --bg: #f2f2f7;
    --card: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a8984;
    --line: #e4e3df;
    --field: #f2f2f7;
    --accent: #2a78d6;
    --on-accent: #ffffff;
    --danger: #d03b3b;
    --key: #ffffff;
    --key-fn: #dcdce2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --line: #2c2c2a;
      --field: #262624;
      --accent: #4c94ea;
      --on-accent: #ffffff;
      --danger: #ef6a6a;
      --key: #2a2a28;
      --key-fn: #4a4a47;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) 12px calc(env(safe-area-inset-left) + 16px);
  }
  .view[hidden] { display: none; }
  .card { background: var(--card); border-radius: 18px; }

  /* 도핑시계 */
  #view-doff { overflow-y: auto; }
  #runList { flex: none; display: flex; flex-direction: column; gap: 12px; }
  #runList:empty { display: none; }
  .run { padding: 12px 16px 14px; }
  .run:first-child { box-shadow: inset 0 0 0 2px var(--accent); }
  .run .rhead { display: flex; align-items: baseline; gap: 10px; }
  .run .rname { font-size: 18px; font-weight: 700; }
  .run .rinfo { margin-left: auto; font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .rnums { display: flex; margin-top: 8px; }
  .run .rnums > div { flex: 1; min-width: 0; }
  .run .cap { display: block; font-size: 13px; color: var(--text-secondary); }
  .run .rend, .run .rleft { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
  .run .rleft { color: var(--accent); }
  .run.soon .rleft { color: var(--danger); }
  .run .ract { display: flex; gap: 8px; margin-top: 10px; }
  .run .ract button { height: 40px; padding: 0 14px; border-radius: 10px; background: var(--field); font-size: 15px; color: var(--text-secondary); }
  .run .ralarm { flex: 1; }
  .run .ralarm:not(.sent) { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .run .rdone { margin-left: auto; }

  .result { flex: none; padding: 12px 20px 14px; text-align: center; }
  .result .label { font-size: 15px; color: var(--text-secondary); }
  .result .time { margin-top: 2px; display: flex; justify-content: center; align-items: baseline; gap: 8px; }
  .result .day { margin-left: 8px; font-size: 17px; font-weight: 700; color: var(--accent); }
  .result .hm { font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -1.5px; }
  .result .sec { font-size: 24px; font-weight: 600; color: var(--text-muted); }
  .result.empty .hm { color: var(--text-muted); }
  .result .sub { margin-top: 4px; font-size: 16px; color: var(--text-secondary); }

  .form { flex: none; padding: 0 16px; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 56px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .name { width: 52px; flex: none; font-size: 17px; color: var(--text-secondary); }
  .row input[type="text"] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--text-primary); text-align: right;
    background: var(--field); border: 0; border-radius: 10px; padding: 8px 12px;
    outline: none; -webkit-user-select: text; user-select: text;
  }
  .row input[type="text"]:focus { box-shadow: 0 0 0 2px var(--accent); }
  .mcrow { align-items: flex-start; padding: 10px 0; }
  .mcrow .name { padding-top: 9px; }
  .chips { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chips button { min-width: 0; height: 40px; padding: 0 2px; border-radius: 10px; background: var(--field); font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips button.on { background: var(--accent); color: var(--on-accent); }
  .chips button.util { font-size: 14px; font-weight: 400; color: var(--text-secondary); }
  .row .unit { width: 50px; flex: none; font-size: 15px; color: var(--text-muted); }
  .row .start { flex: 1; min-width: 0; text-align: right; font-size: 22px; font-weight: 600; }
  .row input[type="time"] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 20px; font-weight: 600; color: var(--text-primary); text-align: right;
    background: var(--field); border: 0; border-radius: 10px; padding: 6px 10px;
  }
  .row input[type="time"][hidden] { display: none; }
  .row input[type="time"]::-webkit-calendar-picker-indicator { display: none; }
  .seg { flex: none; display: flex; background: var(--field); border-radius: 10px; padding: 3px; }
  .seg button { font-size: 15px; padding: 7px 13px; border-radius: 8px; color: var(--text-secondary); }
  .seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .go { flex: none; height: 54px; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-size: 20px; font-weight: 700; }
  .go:disabled { opacity: 0.4; }
  .help { flex: none; padding: 0 16px; font-size: 15px; color: var(--text-secondary); }
  .help summary { padding: 14px 0; }
  .help ol { margin: 0; padding: 0 0 6px 20px; line-height: 1.6; }
  .help p { margin: 0; padding: 6px 0 14px; line-height: 1.6; }
  .help b { color: var(--text-primary); }

  /* 일반 계산기 */
  .display { flex: 1; min-height: 96px; display: flex; flex-direction: column; justify-content: flex-end; text-align: right; padding: 0 8px; overflow: hidden; }
  .display .hist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; margin-bottom: 8px; }
  .display .hist div { font-size: 16px; line-height: 1.7; color: var(--text-muted); overflow-wrap: anywhere; }
  .display .hist div:first-child { margin-top: auto; }
  .display .hist div:active { color: var(--text-primary); }
  .display .expr { min-height: 24px; font-size: 19px; color: var(--text-muted); white-space: nowrap; overflow: hidden; }
  .display .value { font-size: 64px; font-weight: 300; line-height: 1.1; white-space: nowrap; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .keys button {
    height: clamp(54px, 9.4dvh, 78px); border-radius: 18px;
    font-size: 28px; background: var(--key); color: var(--text-primary);
  }
  .keys button.fn { background: var(--key-fn); font-size: 24px; }
  .keys button.op { background: var(--accent); color: var(--on-accent); font-size: 32px; }
  .keys button:active { filter: brightness(0.85); }

  /* 아래 탭 */
  .tabs {
    flex: none; display: flex;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 6px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 12px);
  }
  .tabs button { flex: 1; height: 44px; font-size: 16px; color: var(--text-muted); border-radius: 12px; }
  .tabs button.on { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<main>
  <section class="view" id="view-doff">
    <div id="runList"></div>
    <div class="card result empty" id="result">
      <div class="label">예상 도핑 시각<span class="day" id="doffDay"></span></div>
      <div class="time num">
        <span class="hm" id="doffHM">--:--</span><span class="sec" id="doffSec"></span>
      </div>
      <div class="sub num" id="doffSub">길이를 넣으세요</div>
    </div>
    <div class="card form">
      <div class="row mcrow">
        <span class="name">호기</span>
        <div class="chips" id="mcChips"></div>
      </div>
      <label class="row">
        <span class="name">길이</span>
        <input type="text" id="len" inputmode="decimal" autocomplete="off" placeholder="0">
        <span class="unit">m</span>
      </label>
      <label class="row">
        <span class="name">속도</span>
        <input type="text" id="spd" inputmode="decimal" autocomplete="off" placeholder="0">
        <span class="unit">m/min</span>
      </label>
      <div class="row">
        <span class="name">시작</span>
        <span class="start num" id="nowText"></span>
        <input type="time" id="startTime" hidden>
        <div class="seg">
          <button type="button" id="modeNow" class="on">지금</button>
          <button type="button" id="modeSet">직접</button>
        </div>
      </div>
    </div>
    <button type="button" class="go" id="goBtn" disabled>시작</button>
    <details class="card help">
      <summary>5분 전 알람 설정 방법 (처음 한 번)</summary>
      <ol>
        <li>아이폰 <b>단축어</b> 앱을 열고 오른쪽 위 <b>+</b> 를 누릅니다.</li>
        <li>동작 검색에 <b>알람</b>을 넣고 <b>알람 생성</b>을 고릅니다. (없으면 알람 추가)</li>
        <li>파란 <b>시간</b> 글자를 길게 눌러 <b>단축어 입력</b>을 고릅니다.</li>
        <li>맨 위 이름을 눌러 <b>도핑알람</b>으로 바꾸고 완료를 누릅니다.</li>
      </ol>
      <p>그다음부터는 목록의 <b>5분 전 알람</b> 버튼을 누르면 시계 앱에 알람이 생깁니다. 완료로 목록에서 지워도 맞춰 둔 알람은 남으니 시계 앱에서 지워 주세요.</p>
    </details>
    <template id="runTpl">
      <div class="card run">
        <div class="rhead"><span class="rname"></span><span class="rinfo num"></span></div>
        <div class="rnums num">
          <div><span class="cap cend"></span><span class="rend"></span></div>
          <div><span class="cap cleft"></span><span class="rleft"></span></div>
        </div>
        <div class="ract">
          <button type="button" class="ralarm"></button>
          <button type="button" class="rdone">완료</button>
        </div>
      </div>
    </template>
  </section>

  <section class="view" id="view-calc" hidden>
    <div class="display num">
      <div class="hist" id="calcHist"></div>
      <div class="expr" id="calcExpr"></div>
      <div class="value" id="calcValue">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="fn" data-k="C">C</button><button class="fn" data-k="back">⌫</button><button class="fn" data-k="%">%</button><button class="op" data-k="÷">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="−">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
      <button data-k="sign">±</button><button data-k="0">0</button><button data-k=".">.</button><button class="op" data-k="=">=</button>
    </div>
  </section>
</main>

<nav class="tabs">
  <button type="button" data-view="doff" class="on">도핑시계</button>
  <button type="button" data-view="calc">계산기</button>
</nav>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const DEFAULT_SPEED = 500;

// ── 숫자 표시 ──
function withCommas(s) {            // "180000.5" → "180,000.5" (부호·소수점 유지)
  if (/e/i.test(s)) return s;
  const neg = s.startsWith('-');
  const [i, d] = (neg ? s.slice(1) : s).split('.');
  return (neg ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d !== undefined ? '.' + d : '');
}
function parseNum(s) { return parseFloat(String(s).replace(/,/g, '')); }

// 입력 칸에 천 단위 쉼표를 넣고 커서 위치를 유지한다
function formatField(el) {
  const before = el.value.slice(0, el.selectionStart).replace(/[^\d.]/g, '').length;
  let s = el.value.replace(/[^\d.]/g, '');
  const dot = s.indexOf('.');
  if (dot >= 0) s = s.slice(0, dot + 1) + s.slice(dot + 1).replace(/\./g, '');
  el.value = withCommas(s);
  let pos = 0, seen = 0;
  while (pos < el.value.length && seen < before) { if (/[\d.]/.test(el.value[pos])) seen++; pos++; }
  el.setSelectionRange(pos, pos);
}

// ── 도핑시계 ──
let manualStart = false;
let runs = [];                      // "시작"을 누른 롤들 { id, name, len, spd, startMs, endMs, alarm } — 앱을 닫아도 남는다
function saveRuns() { try { localStorage.setItem('doff.runs', JSON.stringify(runs)); } catch (e) {} }
try {
  runs = JSON.parse(localStorage.getItem('doff.runs')) || [];
  const old = JSON.parse(localStorage.getItem('doff.run'));   // 롤 하나만 잡던 이전 판의 저장값을 옮긴다
  if (old) { runs.push({ id: old.startMs, name: '', ...old }); saveRuns(); localStorage.removeItem('doff.run'); }
} catch (e) {}

// 호기 목록: 처음엔 기본값이고, 휴대폰에서 더하거나 뺄 수 있다. selMc는 새 롤에 고른 호기
const DEFAULT_MACHINES = ['2A', '2B', '3A', '3B', '4A', '4A-1', '4B', '5A', '5B', '5B-1', '6A', '6A-1', '6B'];
let machines = DEFAULT_MACHINES, selMc = '';
try { machines = JSON.parse(localStorage.getItem('doff.machines.v2')) || DEFAULT_MACHINES; } catch (e) {}
function saveMachines() { try { localStorage.setItem('doff.machines.v2', JSON.stringify(machines)); } catch (e) {} }
function renderMachines() {
  const chip = (text, cls, k) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = text; b.className = cls; b.dataset.k = k;
    return b;
  };
  $('mcChips').replaceChildren(
    ...machines.map(m => chip(m, m === selMc ? 'on' : '', 'pick')),
    chip('+ 추가', 'util', 'add'),
    ...(selMc ? [chip('− 빼기', 'util', 'del')] : []));
}

// 길이(m), 속도(m/min), 시작 시각 → 소요 시간(초)과 도핑 시각
function calcDoff(lengthM, speed, start) {
  const durSec = Math.round(lengthM / speed * 60);
  return { durSec, end: new Date(start.getTime() + durSec * 1000) };
}
function dayDiff(from, to) {
  const day = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return Math.round((day(to) - day(from)) / 86400000);
}
const dayText = dd => dd <= 0 ? '' : dd === 1 ? '다음날' : '+' + dd + '일';
function durText(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + '시간 ' : '') + m + '분' + (s ? ' ' + s + '초' : '');
}
const countdown = sec => Math.floor(sec / 3600) + ':' + pad(Math.floor(sec % 3600 / 60)) + ':' + pad(sec % 60);
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const hms = d => hm(d) + ':' + pad(d.getSeconds());

// 5분 전 알람: 소리는 아이폰 시계 앱에 맡긴다 (웹앱은 화면이 꺼지면 못 울린다). 단축어 "도핑알람"이 시각을 받아 알람을 만든다
const ALARM_LEAD_MIN = 5;
const ALARM_SHORTCUT = '도핑알람';
// 롤의 알람 시각(분 단위로 내림). 시계 알람은 시·분만 알아서, 이미 지났거나 24시간 넘게 남았으면 다른 날에 울리므로 null
function alarmTime(r, now) {
  const t = new Date(r.endMs - ALARM_LEAD_MIN * 60000);
  t.setSeconds(0, 0);
  const ahead = t - now;
  return ahead > 0 && ahead < 86400000 ? t : null;
}
const alarmUrl = t => 'shortcuts://run-shortcut?name=' + encodeURIComponent(ALARM_SHORTCUT) + '&input=text&text=' + encodeURIComponent(hm(t));

// 입력 칸으로 본 시작 시각 (직접 입력 칸이 비어 있으면 null)
function inputStart(now) {
  if (!manualStart) return now;
  const [h, m] = $('startTime').value.split(':').map(Number);
  if (isNaN(h) || isNaN(m)) return null;
  const d = new Date(now);
  d.setHours(h, m, 0, 0);
  return d;
}

// 새 롤 입력에 대한 예상 도핑 시각
function renderPreview(now) {
  $('nowText').textContent = hms(now);
  const len = parseNum($('len').value), spd = parseNum($('spd').value), start = inputStart(now);
  const hint = !(len > 0) ? '길이를 넣으세요' : !(spd > 0) ? '속도를 넣으세요' : !start ? '시작 시각을 넣으세요' : '';
  $('result').classList.toggle('empty', !!hint);
  $('goBtn').disabled = !!hint;
  if (hint) {
    $('doffDay').textContent = '';
    $('doffHM').textContent = '--:--';
    $('doffSec').textContent = '';
    $('doffSub').textContent = hint;
    return;
  }
  const { durSec, end } = calcDoff(len, spd, start);
  $('doffDay').textContent = dayText(dayDiff(start, end));
  $('doffHM').textContent = hm(end);
  $('doffSec').textContent = ':' + pad(end.getSeconds());
  $('doffSub').textContent = '소요 ' + durText(durSec) + ' · ' + hm(start) + ' 시작';
}

// 돌아가는 롤 목록: 도핑이 빠른 것부터. 카드는 목록이 바뀔 때만 다시 만들고, 숫자는 매초 tickRuns가 고친다
function renderRuns() {
  runs.sort((a, b) => a.endMs - b.endMs);
  $('runList').replaceChildren(...runs.map(r => {
    const el = $('runTpl').content.firstElementChild.cloneNode(true);
    el.dataset.id = r.id;
    el.querySelector('.rname').textContent = r.name;
    el.querySelector('.rinfo').textContent = r.len + ' m · ' + r.spd + ' m/min · ' + hm(new Date(r.startMs)) + ' 시작';
    return el;
  }));
  tickRuns(new Date());
}
function tickRuns(now) {
  for (const el of $('runList').children) {
    const r = runs.find(x => String(x.id) === el.dataset.id);
    const end = new Date(r.endMs), left = Math.round((r.endMs - now) / 1000), day = dayText(dayDiff(now, end));
    el.querySelector('.cend').textContent = '도핑 시각' + (day ? ' · ' + day : '');
    el.querySelector('.rend').textContent = hms(end);
    el.querySelector('.cleft').textContent = left > 0 ? '남은 시간' : '지난 시간';
    el.querySelector('.rleft').textContent = left > 0 ? countdown(left) : '+' + countdown(-left);
    el.classList.toggle('soon', left <= ALARM_LEAD_MIN * 60);
    const at = alarmTime(r, now), b = el.querySelector('.ralarm');
    b.hidden = !at;
    if (at) {
      b.textContent = r.alarm ? hm(at) + ' 알람 요청함' : ALARM_LEAD_MIN + '분 전 알람 · ' + hm(at);
      b.classList.toggle('sent', !!r.alarm);
    }
  }
}
function tick() {
  const now = new Date();
  renderPreview(now);
  tickRuns(now);
}

function setManual(on) {
  manualStart = on;
  if (on) $('startTime').value = hm(new Date());
  $('startTime').hidden = !on;
  $('nowText').hidden = on;
  $('modeNow').classList.toggle('on', !on);
  $('modeSet').classList.toggle('on', on);
  tick();
}

let savedSpeed = null;
try { savedSpeed = localStorage.getItem('doff.speed'); } catch (e) {}
$('spd').value = withCommas(savedSpeed || String(DEFAULT_SPEED));

$('mcChips').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.k === 'pick') selMc = selMc === b.textContent ? '' : b.textContent;
  else if (b.dataset.k === 'add') {
    const name = (prompt('추가할 호기 이름') || '').trim();
    if (!name) return;
    if (!machines.includes(name)) { machines = machines.concat(name); saveMachines(); }
    selMc = name;
  } else {
    if (!confirm('[' + selMc + '] 호기 목록에서 뺄까요?')) return;
    machines = machines.filter(m => m !== selMc);
    saveMachines();
    selMc = '';
  }
  renderMachines();
});
$('len').addEventListener('input', () => { formatField($('len')); tick(); });
$('spd').addEventListener('input', () => {
  formatField($('spd'));
  if (parseNum($('spd').value) > 0) { try { localStorage.setItem('doff.speed', $('spd').value.replace(/,/g, '')); } catch (e) {} }
  tick();
});
$('startTime').addEventListener('input', tick);
$('modeNow').addEventListener('click', () => setManual(false));
$('modeSet').addEventListener('click', () => setManual(true));

// 시작: 그 순간(직접 입력이면 넣은 시각)을 시작 시각으로 찍어 목록에 올린다
$('goBtn').addEventListener('click', () => {
  const name = selMc, start = inputStart(new Date());
  const same = name && runs.find(r => r.name === name);
  if (same && !confirm('[' + name + '] 이미 돌아가는 목록에 있습니다. 새 롤로 바꿀까요?')) return;
  const end = calcDoff(parseNum($('len').value), parseNum($('spd').value), start).end;
  runs = runs.filter(r => r !== same);
  runs.push({ id: Date.now(), name, len: $('len').value, spd: $('spd').value, startMs: start.getTime(), endMs: end.getTime() });
  saveRuns();
  selMc = '';
  renderMachines();
  $('len').value = '';              // 같은 값으로 두 번 눌러 롤이 겹쳐 올라가지 않게 비운다
  if (document.activeElement) document.activeElement.blur();
  renderRuns();                     // 카드를 먼저 새로 만든다 (setManual의 tick이 지워진 롤의 옛 카드를 만지지 않게)
  setManual(false);
  $('view-doff').scrollTop = 0;
});
$('runList').addEventListener('click', e => {
  const card = e.target.closest('.run');
  if (!card) return;
  const r = runs.find(x => String(x.id) === card.dataset.id);
  if (e.target.closest('.ralarm')) {
    const at = alarmTime(r, new Date());
    if (!at) return;
    r.alarm = true;                 // 실제로 만들어졌는지는 알 수 없어 "요청함"으로만 적는다
    saveRuns();
    tick();
    location.href = alarmUrl(at);
  } else if (e.target.closest('.rdone')) {
    if (!confirm((r.name ? '[' + r.name + ']' : '이 롤을') + ' 목록에서 지울까요?')) return;
    runs = runs.filter(x => x !== r);
    saveRuns();
    renderRuns();
  }
});
setInterval(tick, 1000);
document.addEventListener('visibilitychange', tick);
renderMachines();
renderRuns();
tick();

// ── 일반 계산기 ──
// tokens: [수, 연산자, 수, …], cur: 지금 치고 있는 수(문자열), done: 방금 = 을 눌렀는지
const calc = { tokens: [], cur: '', done: false, expr: '', error: false };
const trim = v => String(parseFloat(v.toPrecision(12)));
const HISTORY_MAX = 20;             // 지난 계산식을 이만큼 기억한다 (앱을 껐다 켜도 남는다)
let calcHist = [];
try { calcHist = JSON.parse(localStorage.getItem('calc.history')) || []; } catch (e) {}

function evalTokens(t) {            // 곱셈·나눗셈 먼저, 그다음 덧셈·뺄셈
  const a = t.slice();
  for (let i = 1; i < a.length;) {
    if (a[i] === '×' || a[i] === '÷') a.splice(i - 1, 3, a[i] === '×' ? a[i - 1] * a[i + 1] : a[i - 1] / a[i + 1]);
    else i += 2;
  }
  let r = a[0];
  for (let i = 1; i < a.length; i += 2) r = a[i] === '+' ? r + a[i + 1] : r - a[i + 1];
  return r;
}
const exprText = t => t.map(x => typeof x === 'number' ? withCommas(trim(x)) : x).join(' ');

function pressKey(k) {
  const c = calc;
  if (c.error || k === 'C') { c.tokens = []; c.cur = ''; c.done = false; c.expr = ''; c.error = false; if (k === 'C') return; }
  if (/^\d$/.test(k) || k === '.') {
    if (c.done) { c.cur = ''; c.done = false; c.expr = ''; }
    if (k === '.') { if (!c.cur.includes('.')) c.cur = (c.cur === '' || c.cur === '-' ? c.cur + '0' : c.cur) + '.'; }
    else if (c.cur.replace(/\D/g, '').length < 15) c.cur = (c.cur === '0' ? '' : c.cur === '-0' ? '-' : c.cur) + k;
  } else if (k === 'back') {
    if (c.done) { c.cur = ''; c.done = false; c.expr = ''; }
    else if (c.cur !== '') { c.cur = c.cur.slice(0, -1); if (c.cur === '-') c.cur = ''; }
    else if (c.tokens.length) { c.tokens.pop(); c.cur = trim(c.tokens.pop()); }   // 연산자를 지우고 앞의 수로 돌아간다
  } else if (k === 'sign') {
    if (c.cur !== '') { c.cur = c.cur.startsWith('-') ? c.cur.slice(1) : '-' + c.cur; c.done = false; c.expr = ''; }
  } else if (k === '%') {
    if (c.cur !== '') { c.cur = trim(parseFloat(c.cur) / 100); c.done = false; c.expr = ''; }
  } else if (k === '=') {
    if (c.cur !== '') c.tokens.push(parseFloat(c.cur));
    else if (c.tokens.length) c.tokens.pop();
    if (!c.tokens.length) return;
    const r = evalTokens(c.tokens);
    c.expr = exprText(c.tokens) + ' =';
    if (isFinite(r) && c.tokens.length > 1) {
      calcHist = calcHist.concat(c.expr + ' ' + withCommas(trim(r))).slice(-HISTORY_MAX);
      try { localStorage.setItem('calc.history', JSON.stringify(calcHist)); } catch (e) {}
    }
    c.tokens = [];
    if (!isFinite(r)) { c.cur = ''; c.error = true; }
    else { c.cur = trim(r); c.done = true; }
  } else {                           // + − × ÷
    if (c.cur !== '') { c.tokens.push(parseFloat(c.cur), k); c.cur = ''; }
    else if (c.tokens.length) c.tokens[c.tokens.length - 1] = k;
    else c.tokens.push(0, k);
    c.done = false; c.expr = '';
  }
}

// 기록 한 줄("180,000 ÷ 500 = 360")의 식을 다시 불러와 이어서 고칠 수 있게 한다
function loadHistory(line) {
  const parts = line.split(' = ')[0].split(' ').map((x, i) => i % 2 ? x : parseNum(x));
  calc.cur = trim(parts.pop());
  calc.tokens = parts;
  calc.done = false; calc.expr = ''; calc.error = false;
}

function renderCalc() {
  const c = calc;
  let shown = c.cur;
  if (shown === '') shown = c.tokens.length ? trim(c.tokens[c.tokens.length - 2]) : '0';
  const text = c.error ? '오류' : withCommas(shown);
  $('calcValue').textContent = text;
  $('calcValue').style.fontSize = text.length > 15 ? '30px' : text.length > 11 ? '40px' : text.length > 8 ? '52px' : '';
  $('calcExpr').textContent = c.expr || exprText(c.tokens);
  // 방금 끝낸 계산은 아래 큰 글씨로 보이고 있으니 기록 목록에서는 뺀다
  const shownNow = c.done && calcHist[calcHist.length - 1] === c.expr + ' ' + text;
  const h = $('calcHist');
  h.replaceChildren(...(shownNow ? calcHist.slice(0, -1) : calcHist).map(t => {
    const d = document.createElement('div');
    d.textContent = t;
    return d;
  }));
  h.scrollTop = h.scrollHeight;
}
$('keys').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  pressKey(b.dataset.k);
  renderCalc();
});

$('calcHist').addEventListener('click', e => {
  if (e.target === e.currentTarget) return;
  loadHistory(e.target.textContent);
  renderCalc();
});

// ── 탭 ──
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (document.activeElement) document.activeElement.blur();
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('view-doff').hidden = b.dataset.view !== 'doff';
  $('view-calc').hidden = b.dataset.view !== 'calc';
  renderCalc();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
