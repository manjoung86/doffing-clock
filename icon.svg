<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 도핑시계 아이콘: 옆에서 본 권취 롤이 곧 시계 문자판 -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.8">
      <stop offset="0" stop-color="#2b4f7c"/>
      <stop offset="1" stop-color="#0a1422"/>
    </radialGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#d98a1e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 롤에서 풀려 나가는 필름 -->
  <path d="M256 424 H470" stroke="url(#roll)" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- 감긴 필름 -->
  <circle cx="256" cy="256" r="168" fill="url(#roll)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#b9741a" stroke-width="3" opacity="0.55"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="#b9741a" stroke-width="3" opacity="0.45"/>
  <!-- 문자판 -->
  <circle cx="256" cy="256" r="116" fill="#0e1c30"/>
  <g stroke="#f4f1e8" stroke-linecap="round">
    <path d="M256 256 V172" stroke-width="18"/>
    <path d="M256 256 L318 292" stroke-width="18"/>
  </g>
  <circle cx="256" cy="256" r="16" fill="#f4f1e8"/>
</svg>
